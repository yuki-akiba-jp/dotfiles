unbind C-b
set -g prefix C-l
bind C-l send-prefix

bind V split-window -h -c "#{pane_current_path}"
bind S split-window -v -c "#{pane_current_path}"
bind H split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Flash pane numbers for 0.5 seconds when switching panes
set-hook -g after-select-pane 'display-panes'
set -g display-panes-time 500
set -g display-panes-active-colour colour51    # bright cyan for active pane
set -g display-panes-colour colour238          # dim gray for inactive panes

setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection


set -s escape-time 0
set-option -g default-terminal "screen-256color"

bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind -n C-b select-pane -t :.+
